<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- Subtle pattern -->
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.04)"/>
  <circle cx="350" cy="450" r="100" fill="rgba(255,255,255,0.04)"/>
  <!-- Head -->
  <circle cx="200" cy="175" r="72" fill="rgba(255,255,255,0.18)"/>
  <!-- Body / Shoulders -->
  <ellipse cx="200" cy="420" rx="140" ry="110" fill="url(#body)" opacity="0.85"/>
  <!-- Initials -->
  <text x="200" y="195" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.9)" font-size="52" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="-2">JV</text>
  <!-- Decorative dots -->
  <circle cx="320" cy="60" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="340" cy="80" r="2.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="80" cy="420" r="3.5" fill="rgba(255,255,255,0.2)"/>
</svg>
